<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdomsalt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cinzel:wght@500&family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-bar">
      <a href="#top" class="logo">Kingdomsalt</a>
      <a href="cart.html" class="cart-link" aria-label="Cart, empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" hidden>0</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav-items" id="menu" aria-label="Main">
      <a href="gallery.html?category=lifestyle">Holders</a>
      <a href="gallery.html?category=stationery">Stationery</a>
      <a href="gallery.html?category=accessories">Accessories</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <header class="header" id="top">
    <div class="hero" id="hero" role="region" aria-roledescription="carousel" aria-label="Featured products">
      <div class="hero-slides" id="hero-slides">
        <!-- js/hero.js builds the full slideshow from data/products.json; this first slide shows if scripts are off -->
        <a class="hero-slide is-active" href="product.html?id=scented-tin-candle">
          <img src="assets/banner-candle-1200.jpg" alt="Colourful mandala-pattern scented candle tins and gift boxes">
        </a>
      </div>
      <button class="hero-arrow hero-prev" id="hero-prev" type="button" aria-label="Previous product" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="hero-arrow hero-next" id="hero-next" type="button" aria-label="Next product" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="shelves" id="shelves" aria-live="polite">
      <!-- js/shelves.js fills in one row per category from data/products.json -->
    </div>
  </main>

  <footer class="footer">
    <a class="footer-card" href="contact.html" aria-label="Contact Kingdomsalt">
      <img class="footer-img" src="assets/footer-mountain.jpg" alt="Sunlit mountain above a valley with low clouds" loading="lazy" decoding="async">
      <span class="footer-inner">
        <span class="monogram">KS.</span>
        <span class="footer-row">
          <span class="footer-contact">Contact</span>
        </span>
      </span>
    </a>
    <nav class="footer-links" aria-label="Policies">
      <a href="shipping.html">Shipping policy</a>
      <a href="refunds.html">Refund policy</a>
      <a href="terms.html">Terms of sale</a>
      <a href="privacy.html">Privacy policy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/hero.js"></script>
  <script src="js/shelves.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
