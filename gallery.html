<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Kingdomlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cinzel:wght@500&family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
  <header class="nav" id="nav">
    <div class="announce" role="note"><span>Free shipping across Australia</span><i aria-hidden="true">&middot;</i><span>Estimated delivery 10&ndash;25 business days</span></div>
    <div class="nav-bar">
      <a href="index.html" class="logo"><svg class="logo-mark" viewBox="-44 -52 88 92" aria-hidden="true" focusable="false"><path d="M-40 26 L-40-8 L-20 8 L-9-6 L9-6 L20 8 L40-8 L40 26 Z" fill="currentColor"/><rect x="-40" y="30" width="80" height="7" rx="2" fill="currentColor"/><path class="mark-flame" d="M0-50C6-40 10-34 10-27c0 6-4 10-10 10S-10-21-10-27C-10-34-4-40 0-50Z" fill="#e08a2c"/></svg><span>Kingdomlight</span></a>
      <a href="cart.html" class="cart-link" aria-label="Cart, empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" hidden>0</span>
      </a>
    </div>
    <nav class="nav-items" id="menu" aria-label="Main">
      <a href="gallery.html?category=accessories">Candles</a>
      <a href="gallery.html?category=lifestyle">Holders</a>
      <a href="gallery.html?category=stationery">Accessories</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="page-header page-banner">
    <div class="pb-img"><img src="assets/banner-soy-candle-2400.jpg" alt="" width="1600" height="640" fetchpriority="high"></div>
    <h1 class="pb-title" id="page-title">Gallery</h1>
  </div>

  <main>
    <section class="g-section g-collection">
      <h2 class="g-label" id="collection-label"></h2>
      <ul class="g-grid" id="product-grid" aria-live="polite">
        <li class="g-item g-skel" aria-hidden="true">
          <div class="g-info"><span class="skel-line"></span></div>
          <div class="g-img"></div>
        </li>
      </ul>
    </section>

    <section class="suggest" id="suggest" aria-labelledby="suggest-title" aria-live="polite">
      <!-- js/suggest.js fills in a random selection of products -->
    </section>
  </main>

  <footer class="footer">
    <a class="footer-card" href="contact.html" aria-label="Contact Kingdomlight">
      <img class="footer-img" src="assets/footer-candles.jpg" alt="Rows of lit tea light candles glowing in the dark" loading="lazy" decoding="async">
      <span class="footer-inner">
        <span class="monogram">KL.</span>
        <span class="footer-row">
          <span class="footer-contact">Contact</span>
        </span>
      </span>
    </a>
    <nav class="footer-links" aria-label="Policies">
      <a href="shipping.html">Shipping policy</a>
      <a href="refunds.html">Refund policy</a>
      <a href="terms.html">Terms of sale</a>
      <a href="privacy.html">Privacy policy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
