<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Kingdomsalt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cinzel:wght@500&family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-bar">
      <a href="index.html" class="logo">Kingdomsalt</a>
      <a href="cart.html" class="cart-link" aria-label="Cart, empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" hidden>0</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav-items" id="menu" aria-label="Main">
      <a href="gallery.html?category=lifestyle">Lifestyle</a>
      <a href="gallery.html?category=stationery">Stationery</a>
      <a href="gallery.html?category=accessories">Accessories</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="page-header">
    <h1 id="page-title">Gallery</h1>
  </div>

  <main>
    <section class="g-section g-collection">
      <h2 class="g-label" id="collection-label"></h2>
      <ul class="g-grid" id="product-grid" aria-live="polite">
        <li class="g-item g-skel" aria-hidden="true">
          <div class="g-info"><span class="skel-line"></span></div>
          <div class="g-img"></div>
        </li>
      </ul>
    </section>

    <section class="suggest" id="suggest" aria-labelledby="suggest-title" aria-live="polite">
      <!-- js/suggest.js fills in a random selection of products -->
    </section>
  </main>

  <footer class="footer">
    <a class="footer-card" href="contact.html" aria-label="Contact Kingdomsalt">
      <img class="footer-img" src="assets/footer-mountain.jpg" alt="Sunlit mountain above a valley with low clouds" loading="lazy" decoding="async">
      <span class="footer-inner">
        <span class="monogram">KS.</span>
        <span class="footer-row">
          <span class="footer-contact">Contact</span>
        </span>
      </span>
    </a>
    <nav class="footer-links" aria-label="Policies">
      <a href="shipping.html">Shipping policy</a>
      <a href="refunds.html">Refund policy</a>
      <a href="terms.html">Terms of sale</a>
      <a href="privacy.html">Privacy policy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
