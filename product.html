<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – Kingdomlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Cinzel:wght@500&family=Outfit:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-bar">
      <a href="index.html" class="logo">Kingdomlight</a>
      <a href="cart.html" class="cart-link" aria-label="Cart, empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span class="cart-count" hidden>0</span>
      </a>
    </div>
    <nav class="nav-items" id="menu" aria-label="Main">
      <a href="gallery.html?category=accessories">Candles</a>
      <a href="gallery.html?category=lifestyle">Holders</a>
      <a href="gallery.html?category=stationery">Accessories</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="product-wrap" id="product-wrap">
    <a class="product-back" id="product-back" href="gallery.html">&larr; Back</a>
    <div class="product" id="product-root" aria-live="polite">
      <noscript><p>Please turn on JavaScript to see this product.</p></noscript>
      <div class="skel-photo" aria-hidden="true"></div>
      <div class="product-info" aria-hidden="true">
        <span class="skel-line skel-title"></span>
        <span class="skel-line skel-short"></span>
        <span class="skel-line"></span>
        <span class="skel-line"></span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <a class="footer-card" href="contact.html" aria-label="Contact Kingdomlight">
      <img class="footer-img" src="assets/footer-mountain.jpg" alt="Sunlit mountain above a valley with low clouds" loading="lazy" decoding="async">
      <span class="footer-inner">
        <span class="monogram">KL.</span>
        <span class="footer-row">
          <span class="footer-contact">Contact</span>
        </span>
      </span>
    </a>
    <nav class="footer-links" aria-label="Policies">
      <a href="shipping.html">Shipping policy</a>
      <a href="refunds.html">Refund policy</a>
      <a href="terms.html">Terms of sale</a>
      <a href="privacy.html">Privacy policy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
